name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Knip (não bloqueia — achados são acompanhados, não travam o PR ainda)
        run: npm run knip
        continue-on-error: true

  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Upload de cobertura pro Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_LOJA_SLUG: ${{ secrets.E2E_LOJA_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Specs sem credencial configurada (E2E_ADMIN_EMAIL/PASSWORD) pulam
      # sozinhos via test.skip() — não é preciso condicionar o job aqui.
      - name: e2e
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      # Job verde com tudo pulado é pior que job vermelho: parece cobertura e
      # não é. Enquanto faltar secret, o aviso aparece no resumo do run.
      - name: Avisa quando o e2e não executou nada
        if: always()
        shell: bash
        run: |
          if ! grep -qE '[0-9]+ (passed|failed)' e2e.log; then
            echo "::warning title=e2e sem cobertura::Todos os specs pularam por falta de secret. Verde neste job NÃO significa testado."
          fi
